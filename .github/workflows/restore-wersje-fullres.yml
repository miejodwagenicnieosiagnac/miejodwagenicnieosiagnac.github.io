name: Restore Wersje full resolution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-wersje-fullres.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build full-resolution WebP
        id: build
        shell: bash
        run: |
          set -euo pipefail
          src=/tmp/wersje-source.png
          out=/tmp/wersje-full.webp
          curl --fail-with-body --location --retry 3 --retry-delay 2             'https://static.metricool.com/planner/202609/6949475-file-5271026288394127380.png'             --output "$src"

          python3 <<'PY'
          import struct
          p = "/tmp/wersje-source.png"
          b = open(p, "rb").read(24)
          if b[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Source is not a PNG")
          w, h = struct.unpack(">II", b[16:24])
          print(f"source_dimensions={w}x{h}")
          if (w, h) != (2048, 2048):
              raise SystemExit(f"Unexpected source dimensions: {w}x{h}")
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -q 90 -m 6 "$src" -o "$out"
          webpinfo "$out" | head -40
          mv "$out" komiksy/wersje.webp

      - name: Commit image and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/restore-wersje-fullres.yml
          if [ -f komiksy/wersje.webp ]; then
            git add komiksy/wersje.webp
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Restore full-resolution Wersje image"
          git pull --rebase origin main
          git push origin HEAD:main
